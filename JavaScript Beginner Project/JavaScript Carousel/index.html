<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="car">
        <div class="img-wrap">
            <img src="Images/Vid tube.png" alt="">
            <img src="Images/Home page.png" alt="">
            <img src="Images/Facebook post.png" alt="">
        </div>
        <button class="btn prev">‹</button>
        <button class="btn next">›</button>
    </div>

    <script>
        const prev = document.querySelector('.prev');
        const next = document.querySelector('.next');
        const wrap = document.querySelector('.img-wrap');
        const imgs = document.querySelectorAll('.img-wrap img');

    let idx = 0;

function showImg() {
    if (idx >= imgs.length) idx = 0;
    if (idx < 0) idx = imgs.length - 1;
    wrap.style.transform = `translateX(-${idx * 100}%)`;
}

next.addEventListener('click', () => {
    idx++;
    showImg();
});

prev.addEventListener('click', () => {
    idx--;
    showImg();
});

setInterval(() => {
    idx++;
    showImg();
}, 3000);

showImg();
    </script>
</body>
</html>
